<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons & app icons (sources in design/socials/) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d1014" />

    <!-- Primary meta -->
    <title>Breachpoint — Top-Down Tactical Shooter</title>
    <meta
      name="description"
      content="Round-based top-down tactical shooter. Breach, plant, defuse — all through a vision cone in the dark. Play in your browser."
    />

    <!-- Open Graph (Facebook, LinkedIn, Discord, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Breachpoint" />
    <meta property="og:url" content="https://breachpoint.kpav.eu/" />
    <meta property="og:title" content="Breachpoint — Top-Down Tactical Shooter" />
    <meta
      property="og:description"
      content="Round-based top-down tactical shooter. Breach, plant, defuse — all through a vision cone in the dark. Play in your browser."
    />
    <meta property="og:image" content="https://breachpoint.kpav.eu/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Breachpoint — top-down tactical shooter" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Breachpoint — Top-Down Tactical Shooter" />
    <meta
      name="twitter:description"
      content="Round-based top-down tactical shooter. Breach, plant, defuse — all through a vision cone in the dark. Play in your browser."
    />
    <meta name="twitter:image" content="https://breachpoint.kpav.eu/twitter-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d1014; /* theme.ts WORLD.void */
        overflow: hidden;
      }
      /* No flex centering here — Phaser's autoCenter positions the canvas,
         and centering the margin box it produces would double the offset. */
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
