<!-- ============ Breachpoint · paste into <head> of index.html ============ -->

<!-- Favicons & app icons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d1014">

<!-- Primary meta -->
<title>Breachpoint — Top-Down Tactical Shooter</title>
<meta name="description" content="Round-based top-down tactical shooter. Breach, plant, defuse — all through a vision cone in the dark. Play in your browser.">

<!-- Open Graph (Facebook, LinkedIn, Discord, iMessage…) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Breachpoint">
<meta property="og:url" content="https://YOUR-DOMAIN/">
<meta property="og:title" content="Breachpoint — Top-Down Tactical Shooter">
<meta property="og:description" content="Round-based top-down tactical shooter. Breach, plant, defuse — all through a vision cone in the dark. Play in your browser.">
<meta property="og:image" content="https://YOUR-DOMAIN/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Breachpoint — top-down tactical shooter">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
